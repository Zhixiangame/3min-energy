<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三分钟高能 - 碎片爽游</title>
<style>
:root{
  --bg:#070a12; --bg2:#0c1220; --panel:#111a2e; --panel2:#0e1626;
  --cyan:#00f0ff; --pink:#ff2d95; --purple:#9d4dff; --gold:#ffd54a;
  --green:#3dffa8; --red:#ff4d6d; --txt:#e8f0ff; --dim:#8aa0c8; --dimmer:#5a7098;
  --edge:rgba(0,240,255,.35); --edge2:rgba(255,45,149,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 700px at 20% -10%,#16223f 0%,var(--bg) 55%),radial-gradient(900px 600px at 110% 110%,#1a1035 0%,var(--bg) 60%);
  color:var(--txt); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow-x:hidden; user-select:none; -webkit-user-select:none;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 14px 40px;position:relative;}
h1.logo{
  font-size:30px;font-weight:900;letter-spacing:3px;text-align:center;margin:10px 0 2px;
  color:#fff;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 18px rgba(0,240,255,.25);
}
.logo-sub{text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:12px;}
.hidden{display:none !important;}
.section{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid rgba(0,240,255,.14);border-radius:16px;padding:14px;margin-bottom:12px;position:relative;box-shadow:0 4px 24px rgba(0,0,0,.35);}
.section-title{font-size:14px;font-weight:700;color:var(--cyan);letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.btn{
  display:block;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  font-size:17px;font-weight:800;letter-spacing:2px;color:#04121a;
  background:linear-gradient(135deg,var(--cyan),#35c6ff);
  box-shadow:0 0 22px rgba(0,240,255,.35),0 4px 12px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;
}
.btn:active{transform:scale(.96);}
.btn.pink{background:linear-gradient(135deg,var(--pink),#ff5fa8);color:#fff;box-shadow:0 0 22px rgba(255,45,149,.35),0 4px 12px rgba(0,0,0,.4);}
.btn.purple{background:linear-gradient(135deg,var(--purple),#b06bff);color:#fff;box-shadow:0 0 22px rgba(157,77,255,.3),0 4px 12px rgba(0,0,0,.4);}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--cyan);box-shadow:none;font-size:14px;padding:11px;}
.btn.small{width:auto;padding:9px 16px;font-size:13px;border-radius:10px;display:inline-block;}
.btn:disabled{opacity:.45;pointer-events:none;}
.bars{display:flex;gap:12px;margin-bottom:12px;}
.bar{flex:1;background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid rgba(0,240,255,.12);border-radius:14px;padding:10px 12px;text-align:center;}
.bar b{display:block;font-size:20px;color:#fff;}
.bar span{font-size:11px;color:var(--dim);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode-card{
  background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid rgba(255,45,149,.2);
  border-radius:14px;padding:12px;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:center;
}
.mode-card:active{transform:scale(.96);}
.mode-card .icon{font-size:26px;margin-bottom:4px;}
.mode-card b{display:block;font-size:14px;color:#fff;margin-bottom:2px;}
.mode-card span{font-size:11px;color:var(--dim);line-height:1.5;display:block;}
.mode-card .dstat{margin-top:6px;font-size:11px;color:var(--green);}
.frame{position:fixed;inset:0;background:linear-gradient(180deg,#060a14,#0b1020);z-index:40;display:flex;flex-direction:column;}
.frame-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px;flex-wrap:wrap;}
.frame-top .lvl{font-size:12px;color:var(--dim);}
.frame-top .lvl b{color:var(--gold);font-size:15px;}
.hud{display:flex;gap:10px;align-items:center;font-size:13px;}
.hud .pill{background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.25);padding:4px 10px;border-radius:20px;color:var(--cyan);font-weight:700;}
.hud .pill.pink{background:rgba(255,45,149,.08);border-color:rgba(255,45,149,.3);color:var(--pink);}
.xpbar{height:5px;background:#0e1626;border-radius:3px;margin:0 14px 6px;overflow:hidden;}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0%;transition:width .5s;border-radius:3px;}
.play-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px;position:relative;}
.game-title{font-size:16px;font-weight:800;color:#fff;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 14px rgba(0,240,255,.5);}
.game-hint{font-size:12px;color:var(--dim);margin-bottom:14px;text-align:center;line-height:1.6;max-width:420px;}
/* ------- memory game ------- */
.boards{display:grid;gap:10px;justify-content:center;perspective:600px;}
.card{
  aspect-ratio:.72;border-radius:10px;cursor:pointer;position:relative;
  background:linear-gradient(150deg,#1b2a4a,#131c36);border:1px solid rgba(0,240,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:0;transition:transform .25s cubic-bezier(.4,.2,.2,1),box-shadow .18s;
  transform-style:preserve-3d;
}
.card.flip{transform:rotateY(180deg);}
.card .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:10px;font-size:30px;font-weight:900;}
.card .front{background:linear-gradient(150deg,rgba(0,240,255,.18),rgba(157,77,255,.15));color:var(--cyan);font-size:22px;transform:rotateY(0deg);}
.card .back{background:linear-gradient(150deg,#253a63,#1a2a4d);transform:rotateY(180deg);color:#fff;}
.card.matched{background:linear-gradient(150deg,rgba(61,255,168,.22),rgba(0,240,255,.15));border-color:var(--green);}
.card.matched .back{color:var(--green);}
/* ------- rhythm game ------- */
.rhythm-stage{width:100%;max-width:400px;height:360px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0a1220 0%,#111a2e 100%);border:1px solid rgba(0,240,255,.18);border-radius:14px;}
.r-lanes{display:flex;height:100%;gap:4px;padding:8px;}
.r-lane{flex:1;background:rgba(0,240,255,.04);border-radius:8px;position:relative;overflow:hidden;}
.r-note{position:absolute;width:70%;left:15%;height:24px;background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:6px;box-shadow:0 0 12px rgba(0,240,255,.4);top:0;transition:none;}
.r-line{position:absolute;bottom:50px;left:8px;right:8px;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 8px var(--cyan);}
.r-progress{width:100%;height:6px;background:rgba(0,240,255,.1);border-radius:3px;margin-top:10px;}
.r-bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:3px;width:0%;transition:width .2s;}
.r-tap-zone{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.r-tap-circle{width:100px;height:100px;border-radius:50%;border:3px solid rgba(0,240,255,.3);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.r-tap-circle.flash{border-color:var(--cyan);box-shadow:0 0 30px rgba(0,240,255,.6),inset 0 0 20px rgba(0,240,255,.2);background:rgba(0,240,255,.1);transform:scale(1.1);}
.r-tap-label{color:var(--dim);font-size:13px;margin-top:12px;}
/* ------- speed game ------- */
.sp-grid{display:grid;gap:8px;}
.sp-cell{aspect-ratio:1;border-radius:10px;background:#0e1830;border:1px solid rgba(0,240,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--cyan);transition:background .06s,box-shadow .06s;}
.sp-cell.on{background:radial-gradient(circle at 40% 35%,#fff 0%,var(--cyan) 40%,#0a5f7a 100%);box-shadow:0 0 18px var(--cyan);color:#042a3a;}
/* ------- focus game ------- */
.focus-stage{width:100%;max-width:400px;min-height:340px;background:radial-gradient(circle at 50% 45%,#132040 0%,#0a1020 70%);border:1px solid rgba(157,77,255,.25);border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.symbol{font-size:56px;animation:pop .3s ease;transform:scale(1);position:absolute;}
@keyframes pop{0%{transform:scale(.2);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.symbol.target{color:var(--cyan);text-shadow:0 0 24px var(--cyan);}
.symbol.distract{color:var(--pink);text-shadow:0 0 18px rgba(255,45,149,.5);}
/* ------- quiz game ------- */
.quiz-q{font-size:20px;font-weight:800;color:#fff;margin:8px 0 20px;text-align:center;line-height:1.6;min-height:60px;}
.quiz-opts{display:grid;gap:12px;width:100%;max-width:420px;}
.qopt{
  padding:15px;border-radius:12px;cursor:pointer;font-size:16px;color:var(--txt);
  background:#13203c;border:1px solid rgba(0,240,255,.18);text-align:left;transition:transform .12s,background .15s;
}
.qopt:active{transform:scale(.98);}
.qopt.right{background:rgba(61,255,168,.22);border-color:var(--green);color:var(--green);}
.qopt.wrong{background:rgba(255,77,109,.22);border-color:var(--red);color:var(--red);}
/* ------- result ------- */
.result-wrap{position:fixed;inset:0;background:rgba(4,6,12,.9);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
.result-card{background:linear-gradient(160deg,#14203c,#0d1628);border:1px solid var(--edge);border-radius:20px;padding:22px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 40px rgba(0,240,255,.15);}
.total{font-size:44px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0;}
.stars{font-size:26px;letter-spacing:6px;margin-bottom:6px;}
.dim-rows{margin:14px 0;text-align:left;}
.drow{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding:5px 4px;border-bottom:1px dashed rgba(255,255,255,.06);}
.drow b{color:var(--txt);}
.gain{color:var(--green);font-size:13px;margin:8px 0;}
.bonus{color:var(--gold);font-size:13px;animation:glow 1s infinite;}
@keyframes glow{0%,100%{opacity:1;}50%{opacity:.5;}}
.new-badge{margin:6px 0;color:var(--pink);font-weight:800;font-size:14px;}
/* ------- radar ------- */
.radar-box{display:flex;justify-content:center;margin:6px 0 10px;}
canvas{max-width:100%;}
.legend{font-size:12px;color:var(--dim);line-height:2;}
.legend b{color:#fff;}
/* ------- badges ------- */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.badge-item{background:#0f1830;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 4px;text-align:center;font-size:10px;color:var(--dim);}
.badge-item b{display:block;font-size:22px;margin-bottom:2px;filter:grayscale(1) opacity(.3);}
.badge-item.on{border-color:rgba(255,213,74,.5);background:rgba(255,213,74,.06);}
.badge-item.on b{filter:none;}
.badge-item.on span{color:var(--gold);}
.titles-box{font-size:12px;color:var(--dim);line-height:2;}
.titles-box .got{color:var(--pink);font-weight:700;}
/* ------- daily task ------- */
.task-item{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px dashed rgba(255,255,255,.07);font-size:13px;}
.task-item .t-done{color:var(--green);font-weight:800;}
.task-item .t-prog{color:var(--dim);font-size:12px;}
.task-item .t-reward{color:var(--gold);font-size:12px;}
/* ------- login bonus ------- */
.login-bonus{background:linear-gradient(135deg,rgba(255,213,74,.14),rgba(255,45,149,.1));border:1px solid rgba(255,213,74,.4);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.login-bonus b{color:var(--gold);font-size:15px;}
.login-bonus span{font-size:12px;color:var(--dim);}
.streak-dots{display:flex;gap:4px;margin-top:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:#223048;border:1px solid rgba(255,255,255,.15);}
.dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold);}
/* ------- leaderboard ------- */
.lb-row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed rgba(255,255,255,.07);font-size:13px;}
.lb-row .rank{color:var(--gold);font-weight:800;width:26px;}
.lb-row .nm{flex:1;color:var(--txt);}
.lb-row .sc{color:var(--cyan);font-weight:700;}
/* ------- settings ------- */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px dashed rgba(255,255,255,.07);}
.set-row span{font-size:14px;}
.set-row small{display:block;color:var(--dim);font-size:11px;margin-top:2px;}
.switch{width:48px;height:26px;background:#1a2742;border-radius:14px;position:relative;cursor:pointer;transition:background .2s;border:1px solid rgba(255,255,255,.12);}
.switch.on{background:linear-gradient(135deg,var(--cyan),var(--purple));}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;}
.switch.on i{left:24px;}
/* ------- guide ------- */
.guide{position:fixed;inset:0;background:rgba(4,6,12,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;}
.guide h2{font-size:22px;color:#fff;margin-bottom:10px;}
.guide p{color:var(--dim);font-size:14px;line-height:1.9;margin-bottom:8px;max-width:420px;}
.guide .g-num{font-size:40px;font-weight:900;color:var(--cyan);text-shadow:0 0 20px var(--cyan);margin-bottom:8px;}
.guide .step{color:var(--gold);font-size:12px;margin-bottom:14px;letter-spacing:2px;}
.guide .btn{margin-top:10px;max-width:280px;}
.float-tip{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(4,8,16,.92);border:1px solid var(--edge);color:var(--cyan);padding:12px 18px;border-radius:10px;font-size:14px;z-index:90;box-shadow:0 0 24px rgba(0,240,255,.2);animation:fade .35s;}
@keyframes fade{from{opacity:0;transform:translateX(-50%) translateY(-10px);}to{opacity:1;}}
.mb2{margin-bottom:8px;}
.mt8{margin-top:8px;}
.center{text-align:center;}
.dim{color:var(--dim);font-size:12px;}
.linklike{color:var(--cyan);border:none;background:none;cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}
.nick-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--edge);background:#0d1730;color:#fff;font-size:15px;margin-bottom:10px;}
.surprise{position:fixed;inset:0;background:rgba(2,4,10,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.surprise-inner{background:linear-gradient(160deg,#2a1a4a,#1a1035);border:1px solid var(--purple);border-radius:20px;padding:26px;text-align:center;max-width:360px;box-shadow:0 0 50px rgba(157,77,255,.4);}
.surprise-inner .big{font-size:60px;margin-bottom:8px;}
.surprise-inner h2{color:var(--purple);font-size:22px;margin-bottom:8px;text-shadow:0 0 16px var(--purple);}
.surprise-inner p{color:var(--dim);font-size:14px;line-height:1.8;margin-bottom:14px;}
.fab{position:fixed;right:16px;bottom:20px;z-index:30;}
.stage-cover{color:var(--dim);font-size:13px;text-align:center;line-height:2;}
.count3{font-size:72px;font-weight:900;color:var(--cyan);text-shadow:0 0 30px var(--cyan);animation:pulse .7s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.1);opacity:.85;}}
.combo-pop{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:var(--gold);text-shadow:0 0 14px var(--gold);z-index:5;}

.encourage{
  font-size:13px;color:var(--cyan);text-align:center;margin:8px 0;
  padding:8px;border-radius:8px;background:rgba(0,240,255,.08);
}
/* ---- 赛博朋克特效层 ---- */
.cyber-grid{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(0,240,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
}
.scanline{
  position:fixed; inset:0; pointer-events:none; z-index:9999;
  background:linear-gradient(to bottom, transparent 50%, rgba(0,0,0,.08) 50%);
  background-size:100% 4px;
  animation:scan 8s linear infinite;
  opacity:0;
  transition:opacity .5s;
}
.scanline.on{opacity:1;}
@keyframes scan{0%{background-position:0 0;}100%{background-position:0 40px;}}
.glitch-anim{
  animation:glitch .3s steps(2) 1;
}
@keyframes glitch{
  0%{transform:translate(0);clip-path:inset(0);}
  20%{transform:translate(-2px,2px);clip-path:inset(10% 0 60% 0);}
  40%{transform:translate(2px,-1px);clip-path:inset(40% 0 20% 0);}
  60%{transform:translate(-1px,1px);clip-path:inset(60% 0 10% 0);}
  80%{transform:translate(1px,-2px);clip-path:inset(30% 0 50% 0);}
  100%{transform:translate(0);clip-path:inset(0);}
}
.neon-flicker{
  animation:flicker 3s infinite alternate;
}
@keyframes flicker{
  0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;text-shadow:0 0 8px rgba(0,240,255,.5);}
  20%,24%,55%{opacity:.7;text-shadow:none;}
}

</style>
</head>
<body>
<div class="cyber-grid" id="cyber-grid"></div>
<div class="scanline" id="scanline"></div>
<div id="app"></div>

<!-- 玩法适配器：每个玩法一个容器，由 JS 动态填充 -->
<script>
"use strict";
/* ============================================================
   三分钟高能 HighEnergy v1.0 —— 单文件离线可玩
   四大玩法：霓虹速击(算力) / 记忆矩阵(记忆) / 信号过滤(专注) / 知识冲刺(知识)
   系统：自适应难度 / 经验等级 / 能量 / 每日登录 / 每日任务 /
         随机惊喜 / 成就徽章 / 称号 / 本地排行榜 / 雷达图 / 设置
   ============================================================ */
const $ = s => document.querySelector(s);
const SAVE_KEY = "brainlab_v2";
const VERSION = "1.1.0";

const QUIZ = [
  {q:"大脑中主要负责记忆巩固的区域是？",o:["海马体","小脑","杏仁核","脑干"],a:0,cat:"脑科学"},
  {q:"睡眠中把短期记忆转成长期记忆的关键过程是？",o:["尖波涟漪","打鼾","说梦话","磨牙"],a:0,cat:"脑科学"},
  {q:"长期坚持有氧运动最可能提升大脑哪种能力？",o:["记忆与专注力","视力","味觉","身高"],a:0,cat:"脑科学"},
  {q:"\"流体智力\"主要指？",o:["推理和解决问题的能力","背课文的能力","打字速度","超忆症"],a:0,cat:"脑科学"},
  {q:"大脑大约占人体总重量的百分之几？",o:["约2%","约10%","约20%","约30%"],a:0,cat:"脑科学"},
  {q:"多巴胺常被称为？",o:["奖赏与动机化学物质","睡眠激素","疼痛信号","消化酶"],a:0,cat:"脑科学"},
  {q:"间隔重复记忆法的核心思想是？",o:["在遗忘临界点前复习","一次背到天亮","反复抄写十遍","睡前看书到睡着"],a:0,cat:"学习"},
  {q:"费曼学习法强调的核心动作是？",o:["用自己的话讲给别人听","刷题一万道","抄笔记三遍","只看视频不动手"],a:0,cat:"学习"},

function load(){ try{ const r = localStorage.getItem(SAVE_KEY); if(r){ const o=JSON.parse(r); return Object.assign(defaultSave(),o); } }catch(e){} return defaultSave(); }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function level(){ return Math.floor(Math.sqrt(S.xp/40))+1; }
function levelXp(lv){ return Math.pow(lv,2)*40; }
function lvlProgress(){ const lv=level(); const cur=S.xp-levelXp(lv-1); const need=levelXp(lv)-levelXp(lv-1); return Math.max(0,Math.min(100,Math.round(cur/Math.max(1,need)*100))); }

/* ---------------- 音效 ---------------- */
let AC=null, sfxOn=true;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,type,vol,when){ if(!(S&&S.settings&&S.settings.sound)&&sfxOn===null){ return; } const ctx=audio(); if(!ctx||ctx.state==="suspended"){try{ctx.resume();}catch(e){}} const t=ctx.currentTime+(when||0); const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type||"sine"; o.frequency.value=freq; g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.2)); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+(dur||.2)+.02); }
function sfxPlay(name){
  if(!S.settings.sound) return;
  const map={
    ok:()=>tone(660,.12,"square",.12), ok2:()=>tone(880,.1,"triangle",.12),
    bad:()=>tone(180,.22,"sawtooth",.1),
    flip:()=>tone(520,.07,"sine",.08), match:()=>{tone(720,.09,"triangle",.12);tone(960,.12,"triangle",.12,.07);},
    combo:()=>tone(1040,.08,"square",.08), levelup:()=>{tone(523,.1,"square",.12);tone(659,.1,"square",.12,.1);tone(784,.14,"square",.12,.2);tone(1047,.2,"square",.14,.3);},
    surprise:()=>{tone(880,.12,"triangle",.14);tone(1175,.16,"triangle",.14,.12);tone(1568,.22,"triangle",.16,.26);},
    achieve:()=>{tone(784,.12,"triangle",.13);tone(988,.12,"triangle",.13,.1);tone(1319,.2,"triangle",.15,.2);},
    tap:()=>tone(440,.05,"sine",.06), start:()=>tone(587,.1,"square",.1), end:()=>{tone(392,.14,"triangle",.12);tone(523,.2,"triangle",.12,.14);},
    count:()=>tone(440,.08,"sine",.1), tick:()=>tone(1200,.03,"sine",.05)
  };
  if(map[name]) map[name]();
}
/* 播放判定兼容：sfxOn 用于静音环境下规避 AudioContext 报错 */

/* ---------------- 背景音乐系统 ---------------- */
let BGM=null, BGM_TYPE="none";
function initBGM(){
  if(!S.settings.sound || S.settings.bgmStyle==="none"){ stopBGM(); return; }
  BGM_TYPE = S.settings.bgmStyle;
  if(!BGM) BGM=audio();
  if(!BGM) return;
  if(BGM._bgmNodes){ try{BGM._bgmNodes.forEach(n=>{try{n.stop();n.disconnect();}catch(e){}}); }catch(e){} }
  BGM._bgmNodes=[];
  if(BGM_TYPE==="electro") startElectroBGM();
  else if(BGM_TYPE==="jazz") startJazzBGM();
  else if(BGM_TYPE==="beat") startBeatBGM();
}
function stopBGM(){ if(BGM&&BGM._bgmNodes){ try{BGM._bgmNodes.forEach(n=>{try{n.stop();n.disconnect();}catch(e){}}); BGM._bgmNodes=[]; }catch(e){} } BGM_TYPE="none"; }
function bgmTone(freq,dur,type,vol,when,slideTo,slideDur){
  if(!BGM || BGM_TYPE==="none" || !S.settings.sound) return;
  const t=BGM.currentTime+(when||0);
  const o=BGM.createOscillator(), g=BGM.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,t+(slideDur||dur));
  g.gain.setValueAtTime(vol||.08,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.3));
  o.connect(g); g.connect(BGM.destination);
  o.start(t); o.stop(t+(dur||.3)+.02);
  BGM._bgmNodes.push(o,g);
}
function startElectroBGM(){
  // 简单电子合成器琶音循环
  const loop=()=>{
    if(BGM_TYPE!=="electro" || !S.settings.sound) return;
    const base=220;
    [0,4,7,12,7,4,0,-5].forEach((interval,i)=>{
      bgmTone(base*Math.pow(2,interval/12), .25, "sawtooth", .04, i*.35);
    });
    setTimeout(loop, 2800);
  };
  loop();
}
function startJazzBGM(){
  const loop=()=>{
    if(BGM_TYPE!=="jazz" || !S.settings.sound) return;
    const base=261.63;
    [0,4,7,11,7,4,2,0].forEach((interval,i)=>{
      bgmTone(base*Math.pow(2,interval/12), .4, "triangle", .035, i*.5);
    });
    setTimeout(loop, 4000);
  };

}
function startBeatBGM(){
  const loop=()=>{
    if(BGM_TYPE!=="beat" || !S.settings.sound) return;
    // 简单节拍：底鼓+军鼓+踩镲

    });

    });

/* ---------------- 工具 ---------------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dimAvg(d){ return d.n? Math.round(d.sum/d.n) : 0; }

/* ---------------- 每日登录 ---------------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function getSeasonPeriod(){
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth()+1;
  const period=Math.floor((month-1)/2)+1; // 1-6双周赛季
  const startMonth=(period-1)*2+1;
  const endMonth=startMonth+1;
  return {id:`${year}-S${period}`,start:`${year}-${String(startMonth).padStart(2,"0")}-01`,end:`${year}-${String(endMonth).padStart(2,"0")}-${new Date(year,endMonth,0).getDate()}`};
}
function checkSeason(){
  const sp=getSeasonPeriod();
  if(S.season.seasonId!==sp.id){
    // 新赛季
    S.season={seasonId:sp.id,periodStart:sp.start,periodEnd:sp.end,tier:0,xp:0,rewardsClaimed:[]};
    save();
  }
}
function addSeasonXP(amount){
  checkSeason();
  S.season.xp+=amount;
  const tiers=[0,100,300,600,1000,1500,2200];
  let newTier=0;
  for(let i=tiers.length-1;i>=0;i--){ if(S.season.xp>=tiers[i]){ newTier=i; break; } }
  if(newTier>S.season.tier){
    S.season.tier=newTier;
    save();
    return newTier;
  }
  save();
  return 0;
}
function getSeasonRewards(tier){
  const rewards=[
    {tier:1,name:"赛季先锋",icon:"🏆",type:"title"},
    {tier:2,name:"霓虹紫配色",icon:"🎨",type:"theme"},
    {tier:3,name:"知识猎手",icon:"📚",type:"badge"},
    {tier:4,name:"能量 x100",icon:"⚡",type:"energy",amount:100},
    {tier:5,name:"黄金称号",icon:"👑",type:"title"},
    {tier:6,name:"限定赛季徽章",icon:"💎",type:"badge"}
  ];
  return rewards.filter(r=>r.tier<=tier && !S.season.rewardsClaimed.includes(r.tier));
}
function claimSeasonReward(tier){
  const rewards=getSeasonRewards(tier);
  rewards.forEach(r=>{
    if(S.season.rewardsClaimed.includes(r.tier)) return;
    S.season.rewardsClaimed.push(r.tier);
    if(r.type==="energy") S.energy+=r.amount;
    // titles and badges handled by unlockBadge
  });
  save();
}

function checkLogin(){
  const t=todayStr();
  if(S.lastLogin!==t){
    const y=new Date(); y.setDate(y.getDate()-1);
    const yt=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    if(S.lastLogin===yt){ S.streak+=1; } else { S.streak=1; }
    S.lastLogin=t;
    // 记录登录历史
    S.loginHistory=S.loginHistory||[];
    if(!S.loginHistory.includes(t)) S.loginHistory.push(t);
    if(S.loginHistory.length>30) S.loginHistory=S.loginHistory.slice(-30);
    // 里程碑奖励
    let milestone="";
    if(S.streak===14){ S.energy+=200; S.xp+=100; milestone="🎉 连续登录14天！奖励 +200能量 +100经验"; unlockBadge("streak14"); }

}

function startRandomSession(){
  sfxPlay("start");
  const pool=["speed","memory","focus"];
  if(S.settings.quiz) pool.push("knowledge");
  pool.push("rhythm");
  const picks = shuffle(pool).slice(0,3);

}
function startMode(mode){
  sfxPlay("start");
  if(mode==="knowledge" && !S.settings.quiz){
    showTip("知识冲刺已在设置中关闭，去设置里打开吧");
    return;
  }
  currentRun = {modes:[mode], idx:0, subs:{}, total:0};

function preLoadStage(){
  const info = MODE_INFO[currentRun.modes[0]];

function gameFrame(info){

      <div class="game-title">${info.ic} ${info.nm} · 第 ${currentRun.idx+1}/${currentRun.modes.length} 关</div>
      <div class="game-hint">${info.hint}</div>
      <div id="stage-root" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
    </div>`;
  const sub={score:0,combo:0,maxCombo:0,ok:0,bad:0,miss:0,start:Date.now(),ending:false,extra:{}};
  currentRun.subs[mode]=sub;
  GAMES[mode].start(sub);
}
function updateHud(sub){
  const f=$("#frame"); if(!f) return;
  $("#f-score").textContent=sub.score;
  $("#f-combo").textContent = sub.combo>=3? "🔥"+sub.combo : "连击 "+sub.combo;
  $("#f-combo").style.color = sub.combo>=3? "var(--gold)" : "";
}
function endStage(mode, result){
  const sub=currentRun.subs[mode];
  if(!sub || sub.ending) return false;
  Object.assign(sub,{ending:true});
  if(result) Object.assign(sub,result);
  currentRun.total += sub.score;
  // 记录维度
  const d=S.dims[mode];
  d.n++; d.sum+=sub.score; if(sub.score>d.best)d.best=sub.score;
  save();
  // 任务进度
  if(mode==="speed" && sub.score>=800) taskProgress("speed800",1);
  if(mode==="memory" && sub.ok>0 && sub.bad===0) taskProgress("memperfect",1);
  if(mode==="focus" && sub.ok/(sub.ok+sub.bad||1)>=.8) taskProgress("focusacc",1);
  if(mode==="knowledge") taskProgress("quizok", sub.ok||0);
  if(mode==="rhythm" && sub.score>=600) taskProgress("rhythm600",1);
  if(sub.maxCombo>=8) taskProgress("combo8",1);
  if(sub.extra&&sub.extra.spend) trackSpend(sub.extra.spend);

  const f=$("#frame"); if(!f) return;
  if(currentRun.idx < currentRun.modes.length-1){
    currentRun.idx++;
    const next=MODE_INFO[currentRun.modes[currentRun.idx]];
    $("#game-body").innerHTML=`
      <div class="play-area">
        <div class="game-title">🏁 本关完成！<span style="font-size:14px;color:var(--dim)">+${sub.score} 分</span></div>
        <div class="game-hint">准备进入下一关：${next.ic} ${next.nm}</div>
        <div class="count3" id="next-count">2</div>
      </div>`;
    sfxPlay("end");
    let n=2; const iv=setInterval(()=>{ n--; if(n>0){$("#next-count").textContent=n; sfxPlay("count");} else {clearInterval(iv); launchStage();} },700);
  } else {
    finishRun();
  }
}
function finishRun(){
  const subAll=currentRun.subs;
  const total=currentRun.total;
  const modes=currentRun.modes;
  const lvBefore=level();
  // 记录历史
  const h={date:todayStr(), total, modes:modes.slice(),
    dims:{speed:subAll.speed?subAll.speed.score:0,memory:subAll.memory?subAll.memory.score:0,
          focus:subAll.focus?subAll.focus.score:0,knowledge:subAll.knowledge?subAll.knowledge.score:0,
          rhythm:subAll.rhythm?subAll.rhythm.score:0}};
  S.history=S.history||[]; S.history.push(h); if(S.history.length>90)S.history=S.history.slice(-90);
  // 结算：经验与能量
  const xpGain = Math.max(10, Math.round(total/12));
  const egain = Math.max(3, Math.round(total/60));
  S.xp += xpGain; S.energy += egain;
  const newTier=addSeasonXP(Math.round(total/20));
  if(newTier>0){ setTimeout(()=>{ showTip(`🎉 赛季等级提升到 ${newTier}！去赛季页面领取奖励`); sfxPlay("achieve"); }, 800); }
  S.totalSessions++; trackSession();
  if(total>S.bestTotal){ S.bestTotal=total; S.isNewBest=true; } else S.isNewBest=false;
  const wasLv=lvBefore;
  // 成就检查
  const res={speed:subAll.speed?subAll.speed.score:0,memory:subAll.memory?subAll.memory.score:0,focus:subAll.focus?subAll.focus.score:0,knowledge:subAll.knowledge?subAll.knowledge.score:0,
    rhythm:subAll.rhythm?subAll.rhythm.score:0,
    memPerfect:!!(subAll.memory&&subAll.memory.bad===0&&subAll.memory.ok>0),
    focusAcc:subAll.focus? subAll.focus.ok/((subAll.focus.ok+subAll.focus.bad)||1) : 0,
    quizOK:subAll.knowledge?subAll.knowledge.ok:0, total};
  const newBadgesBefore=Object.keys(S.badges).length;
  checkBadges(res);
  const newBadges = BADGES.filter(b=>S.badges[b.id]).length - newBadgesBefore;
  const lvAfter=level();
  const leveled = lvAfter>lvBefore;
  if(leveled) unlockBadge("lv3")||unlockBadge("lv5")||unlockBadge("lv8"), sfxPlay("levelup");
  addScore(total);
  save();
  sfxPlay("end");
  maybeSurprise();
  showResult({total,subAll,modes,xpGain,egain,leveled,lvAfter,newBadges,newBest:S.isNewBest});
  S.isNewBest=false;
}

/* ================= 玩法实现 ================= */
const GAMES = {};

/* ---------- 1. 霓虹速击（算力） ---------- */
GAMES.speed = {
  start(sub){
    const avg=dimAvg(S.dims.speed);
    const recent = S.history.filter(h=>h.dims.speed>0).slice(-5);
    const trend = recent.length>=3 ? (recent.slice(-3).reduce((a,h)=>a+h.dims.speed,0)/3) : avg;
    const smooth = avg*0.6 + trend*0.4;  // 平滑：60%历史平均 + 40%近期趋势
    const size = smooth>1300?5 : smooth>500?4 : 3;
    const durMs = Math.max(500, 1400 - smooth/3.5);
    const roundMs=30000;
    const root=$("#stage-root"); if(!root) return;
    root.innerHTML=`<div class="game-hint">点中亮起的格子！漏点会扣分，点错也扣分</div>
      <div class="sp-grid" style="grid-template-columns:repeat(${size},${size>=5?"58px":size>=4?"66px":"76px"})"></div>`;
    const grid=root.querySelector(".sp-grid");
    for(let i=0;i<size*size;i++){ const c=document.createElement("div"); c.className="sp-cell"; c.dataset.i=i; grid.appendChild(c); }
    const cells=[...grid.children];
    let active=-1, timer=null, tick=0;
    const showTarget=()=>{
      if(sub.ending) return;
      let idx=ri(0,size*size-1); if(idx===active) idx=(idx+1)%(size*size);
      active=idx;
      const c=cells[idx]; c.classList.add("on"); sfxPlay("tick");
      clearTimeout(timer);
      timer=setTimeout(()=>{ if(sub.ending)return; c.classList.remove("on"); sub.miss++; sub.combo=0; updateHud(sub); active=-1; showTarget(); }, durMs);
    };
    cells.forEach(c=>{
      c.onclick=()=>{
        if(sub.ending) return;
        if(Number(c.dataset.i)===active){
          c.classList.remove("on"); clearTimeout(timer); active=-1;
          sub.ok++; sub.combo++; if(sub.combo>sub.maxCombo)sub.maxCombo=sub.combo;
          const add=80+Math.min(40,sub.combo*5);
          sub.score+=add; sfxPlay(sub.combo>=6?"combo":"ok");
          updateHud(sub);
          maybeTrail(c,add);
          setTimeout(showTarget,120);
        } else {
          sub.bad++; sub.combo=0; sub.score=Math.max(0,sub.score-25); sfxPlay("bad"); updateHud(sub);
          c.style.borderColor="var(--red)"; setTimeout(()=>c.style.borderColor="",160);
        }
      };
    });
    setTimeout(showTarget,300);
    setTimeout(()=>endStage("speed",{ok:sub.ok,bad:sub.bad,miss:sub.miss}), roundMs);
    // 提示附加分
    function maybeTrail(c,add){
      const p=document.createElement("div"); p.className="combo-pop"; p.textContent="+"+add;
      const r=root.getBoundingClientRect(); p.style.left="50%"; root.appendChild(p);
      setTimeout(()=>p.remove(),500);
    }
  }
};

/* ---------- 2. 记忆矩阵（记忆） ---------- */
GAMES.memory = {
  start(sub){
    const avg=dimAvg(S.dims.memory);
    const recent = S.history.filter(h=>h.dims.memory>0).slice(-5);
    const trend = recent.length>=3 ? (recent.slice(-3).reduce((a,h)=>a+h.dims.memory,0)/3) : avg;
    const smooth = avg*0.6 + trend*0.4;
    const pairs = smooth>1600?6 : smooth>700?5 : 4;
    const emojis=["🐱","🐶","🦊","🐼","🐸","🦄","🐙","🐬","🦋","🦁","🐯","🐨"];
    const set=shuffle(emojis).slice(0,pairs);
    const cards=shuffle([...set,...set]);
    const cols=pairs>=6?4:4;
    const root=$("#stage-root"); if(!root) return;
    root.innerHTML=`<div class="game-hint">翻开卡片，找出相同的两两配对（共 ${pairs} 对）</div>
      <div class="boards" style="grid-template-columns:repeat(${cols},${cols>=4?"70px":"80px"})"></div>`;
    const board=root.querySelector(".boards");
    const totalTime=90;
    // 计时条
    const bar=document.createElement("div"); bar.className="xpbar"; bar.style.margin="10px 0";
    bar.innerHTML='<i style="width:100%;background:linear-gradient(90deg,var(--green),var(--cyan))"></i>';
    root.insertBefore(bar,board);
    const barFill=bar.querySelector("i");
    const t0=Date.now();
    const timerv=setInterval(()=>{
      if(sub.ending) return;
      const left=totalTime-(Date.now()-t0)/1000;
      barFill.style.width=Math.max(0,left/totalTime*100)+"%";
      if(left<=0){ clearInterval(timerv); endStage("memory",{}); }
    },200);
    const timeBonus = ()=> Math.max(0,Math.round((totalTime-(Date.now()-t0)/1000)*6));
    let first=null, lock=false;
    const faces=shuffle(["🐱","🐶","🦊","🐼","🐸","🦄","🐙","🐬","🦋","🦁","🐯","🐨"].slice(0,pairs));
    const deck=shuffle([...faces,...faces]);
    const divs=[];
    deck.forEach((f,i)=>{
      const d=document.createElement("div"); d.className="card"; d.dataset.f=f;
      d.innerHTML=`<div class="face front">❔</div><div class="face back">${f}</div>`;
      board.appendChild(d); divs.push(d);
      d.onclick=()=>{
        if(sub.ending||lock||d.classList.contains("flip")||d.classList.contains("matched")) return;
        d.classList.add("flip"); sfxPlay("flip");
        if(!first){ first=d; return; }
        lock=true;
        if(first.dataset.f===d.dataset.f){
          setTimeout(()=>{
            first.classList.add("matched"); d.classList.add("matched");
            first=null; lock=false;
            sub.ok++; sub.combo++; if(sub.combo>sub.maxCombo)sub.maxCombo=sub.combo;
            sub.score+=120+sub.combo*20; sfxPlay("match"); updateHud(sub);
            if(board.querySelectorAll(".card.matched").length===deck.length){
              const bonus=timeBonus(); sub.score+=bonus; sub.extra={allDone:true};
              clearInterval(timerv);
              setTimeout(()=>endStage("memory",{ok:sub.ok,bad:sub.bad}),400);
            }
          },320);
        } else {
          setTimeout(()=>{
            first.classList.remove("flip"); d.classList.remove("flip");
            first=null; lock=false;
            sub.bad++; sub.combo=0; sub.score=Math.max(0,sub.score-15); sfxPlay("bad"); updateHud(sub);
          },600);
        }
      };
    });
    // 兜底：全部配对完成或超时结束
    sub._endOnce=0;
    const origEnd=endStage;
  }
};

/* ---------- 3. 信号过滤（专注） ---------- */
GAMES.focus = {
  start(sub){
    const avg=dimAvg(S.dims.focus);
    const recent = S.history.filter(h=>h.dims.focus>0).slice(-5);
    const trend = recent.length>=3 ? (recent.slice(-3).reduce((a,h)=>a+h.dims.focus,0)/3) : avg;
    const smooth = avg*0.6 + trend*0.4;
    const distractRatio = smooth>1400? .58 : smooth>600? .45 : .32;
    const showMs = Math.max(520, 1300 - smooth/3);
    const gapMs = Math.max(380, 1000 - smooth/3);
    const DEFAULT_TARGET="▲";
    const root=$("#stage-root"); if(!root) return;
    root.innerHTML=`<div class="focus-stage" id="fstage"></div>
      <div class="game-hint" style="margin-top:10px">目标符号：<b style="color:var(--cyan);font-size:18px">${DEFAULT_TARGET}</b>（出现时点击）　红色符号出现时<b style="color:var(--pink)">绝不点</b></div>`;
    const stage=$("#fstage");
    let alive=true, seq=0, busy=false, curType=null, curEl=null, curDue=0, timer=null;
    const makeStep=()=>{
      if(sub.ending){ return; }
      seq++;
      const isTarget = Math.random() >= distractRatio;
      const sym = isTarget? DEFAULT_TARGET : pick(["■","●","◆","★","▲"]===undefined?["■"]:["■","●","◆","★","○","◇","□","☆","△"].filter(s=>s!==DEFAULT_TARGET));
      curType = isTarget? "target":"distract";
      const el=document.createElement("div");
      el.className="symbol "+curType; el.textContent=sym;
      stage.innerHTML=""; stage.appendChild(el);
      curEl=el;
      const startAt=Date.now();
      clearTimeout(timer);
      timer=setTimeout(()=>{
        if(sub.ending) return;
        if(curType==="target"){ sub.miss++; sub.combo=0; sub.score=Math.max(0,sub.score-30); sfxPlay("bad"); updateHud(sub); }
        stage.innerHTML=""; curEl=null; curType=null;
        timer=setTimeout(makeStep,gapMs);
      }, showMs);
    };
    stage.addEventListener("click",(e)=>{
      if(sub.ending||!curEl) return;
      clearTimeout(timer);
      if(curType==="target"){
        sub.ok++; sub.combo++; if(sub.combo>sub.maxCombo)sub.maxCombo=sub.combo;
        const add=70+Math.min(30,sub.combo*4);
        sub.score+=add; sfxPlay(sub.combo>=8?"combo":"ok2");
        const p=document.createElement("div"); p.className="combo-pop"; p.textContent="+"+add; p.style.color="var(--cyan)";
        stage.appendChild(p); setTimeout(()=>p.remove(),450);
      } else {
        sub.bad++; sub.combo=0; sub.score=Math.max(0,sub.score-40); sfxPlay("bad");
      }
      updateHud(sub);
      stage.innerHTML=""; curEl=null; curType=null;
      timer=setTimeout(makeStep,gapMs);
    });
    setTimeout(makeStep,300);
    setTimeout(()=>endStage("focus",{ok:sub.ok,bad:sub.bad,miss:sub.miss}), sub.ending?0:42000);
  }
};

/* ---------- 4. 霓虹节拍（节奏） ---------- */
GAMES.rhythm = {
  start(sub){
    const avg=dimAvg(S.dims.rhythm);
    const recent = S.history.filter(h=>h.dims.rhythm>0).slice(-5);
    const trend = recent.length>=3 ? (recent.slice(-3).reduce((a,h)=>a+h.dims.rhythm,0)/3) : avg;
    const smooth = avg*0.6 + trend*0.4;
    const bpm = Math.min(180, Math.max(80, 80 + smooth/25));
    const beatInterval = 60000/bpm;
    const totalBeats = Math.floor(42000/beatInterval);
    const mode = Math.random()>0.5 ? "fall" : "tap"; // fall=下落式, tap=固定圆圈
    const root=$("#stage-root"); if(!root) return;
    
    root.innerHTML=`<div class="game-hint">跟着节拍点击！${mode==="fall"?"音符落到底线时点击":"圆圈闪烁时精准点击"}</div>
      <div class="rhythm-stage" id="rstage" data-mode="${mode}">
        ${mode==="fall"?
          `<div class="r-lanes"><div class="r-lane" data-l="0"></div><div class="r-lane" data-l="1"></div><div class="r-lane" data-l="2"></div><div class="r-lane" data-l="3"></div></div><div class="r-line"></div>`:
          `<div class="r-tap-zone"><div class="r-tap-circle" id="rtap"></div><div class="r-tap-label">节拍到达时点击</div></div>`
        }
      </div>
      <div class="r-progress"><div class="r-bar" id="rbar"></div></div>`;
    
    const stage=$("#rstage");
    const bar=$("#rbar");
    let beat=0, hits=0, misses=0, perfects=0, goods=0, combo=0, maxCombo=0;
    let activeNotes=[];
    const noteSpeed = Math.max(1.2, 2.5 - smooth/1500);
    
    if(mode==="fall"){
      const lanes=stage.querySelectorAll(".r-lane");
      const lineY=stage.getBoundingClientRect().bottom-80;
      
      const spawnNote=()=>{
        if(sub.ending || beat>=totalBeats) return;
        const lane=ri(0,3);
        const note=document.createElement("div");
        note.className="r-note";
        note.dataset.lane=lane;
        lanes[lane].appendChild(note);
        let pos=0;
        const move=setInterval(()=>{
          if(sub.ending){ clearInterval(move); note.remove(); return; }
          pos += noteSpeed;
          note.style.top=pos+"px";
          if(pos>lanes[lane].offsetHeight+20){
            clearInterval(move); note.remove(); misses++; combo=0; sub.miss++; updateHud(sub); sfxPlay("bad");
          }
        }, 16);
        activeNotes.push({el:note, move, lane});
        beat++;
        bar.style.width=(beat/totalBeats*100)+"%";
      };
      
      lanes.forEach((lane,li)=>{
        lane.addEventListener("click",()=>{
          if(sub.ending) return;
          const notes=[...lane.querySelectorAll(".r-note")];
          const hit=notes.find(n=>{
            const rect=n.getBoundingClientRect();
            const laneRect=lane.getBoundingClientRect();
            return rect.bottom>=laneRect.bottom-45 && rect.bottom<=laneRect.bottom+25;
          });
          if(hit){
            const rect=hit.getBoundingClientRect();
            const laneRect=lane.getBoundingClientRect();
            const offset=Math.abs(rect.bottom-laneRect.bottom+10);
            const isPerfect=offset<12;
            hit.remove();
            const idx=activeNotes.findIndex(x=>x.el===hit);
            if(idx>=0){ clearInterval(activeNotes[idx].move); activeNotes.splice(idx,1); }
            sub.ok++; hits++; combo++; if(combo>maxCombo) maxCombo=combo;
            const add=isPerfect?150:100;
            if(isPerfect) perfects++; else goods++;
            sub.score+=add+Math.min(50,combo*3);
            sfxPlay(combo>=6?"combo":"ok");
            updateHud(sub);
            const pop=document.createElement("div"); pop.className="combo-pop"; pop.textContent=(isPerfect?"PERFECT!":"GOOD")+" +"+add;
            pop.style.color=isPerfect?"var(--gold)":"var(--cyan)";
            lane.appendChild(pop); setTimeout(()=>pop.remove(),500);
          } else {
            sub.bad++; combo=0; sub.score=Math.max(0,sub.score-20); sfxPlay("bad"); updateHud(sub);
          }
        });
      });
      
      const spawner=setInterval(()=>{
        if(sub.ending || beat>=totalBeats){ clearInterval(spawner); return; }
        spawnNote();
      }, beatInterval);
      
      setTimeout(()=>{ clearInterval(spawner); activeNotes.forEach(n=>{clearInterval(n.move); n.el.remove();}); endStage("rhythm",{ok:hits,bad:sub.bad,miss:misses,perfect:perfects,good:goods,maxCombo}); }, totalBeats*beatInterval+1500);
      
    } else {
      // tap mode
      const tapZone=stage.querySelector(".r-tap-zone");
      const circle=stage.querySelector("#rtap");
      let nextFlash=null;
      
      const flash=()=>{
        if(sub.ending || beat>=totalBeats) return;
        circle.classList.add("flash");
        let clicked=false;
        const clickHandler=(e)=>{
          if(clicked || sub.ending) return;
          clicked=true;
          const t=Date.now();
          const diff=Math.abs(t-nextFlash);
          const isPerfect=diff<150;
          circle.classList.remove("flash");
          tapZone.removeEventListener("click", clickHandler);
          sub.ok++; combo++; if(combo>maxCombo) maxCombo=combo;
          const add=isPerfect?140:90;
          if(isPerfect) perfects++; else goods++;
          sub.score+=add+Math.min(40,combo*3);
          sfxPlay(combo>=6?"combo":"ok");
          updateHud(sub);
          const pop=document.createElement("div"); pop.className="combo-pop";
          pop.textContent=(isPerfect?"PERFECT!":"GOOD")+" +"+add;
          pop.style.color=isPerfect?"var(--gold)":"var(--cyan)";
          tapZone.appendChild(pop); setTimeout(()=>pop.remove(),500);
        };
        tapZone.addEventListener("click", clickHandler);
        nextFlash=Date.now();
        
        setTimeout(()=>{
          if(!clicked && !sub.ending){
            circle.classList.remove("flash");
            tapZone.removeEventListener("click", clickHandler);
            misses++; combo=0; sub.miss++; updateHud(sub); sfxPlay("bad");
          }
        }, 400);
        
        beat++;
        bar.style.width=(beat/totalBeats*100)+"%";
        if(beat<totalBeats){
          setTimeout(flash, beatInterval + (Math.random()-.5)*beatInterval*.2);
        }
      };
      
      setTimeout(flash, beatInterval);
      setTimeout(()=>{ endStage("rhythm",{ok:hits,bad:sub.bad,miss:misses,perfect:perfects,good:goods,maxCombo}); }, totalBeats*beatInterval+2000);
    }
    
    sub._endOnce=0;
  }
};

GAMES.knowledge = {
  start(sub){
    const root=$("#stage-root"); if(!root) return;
    const qs=shuffle(QUIZ).slice(0,10);
    let qi=0, lock=false;
    const endT=45, t0=Date.now();
    const bar=document.createElement("div"); bar.className="xpbar"; bar.style.margin="10px 0"; bar.innerHTML='<i style="width:100%;background:linear-gradient(90deg,var(--pink),var(--purple))"></i>';
    root.appendChild(bar); const barFill=bar.querySelector("i");
    const timerv=setInterval(()=>{
      if(sub.ending) return;
      const left=endT-(Date.now()-t0)/1000;
      barFill.style.width=Math.max(0,left/endT*100)+"%";
      if(left<=0){ clearInterval(timerv); endStage("knowledge",{}); }
    },200);
    const renderQ=()=>{
      if(sub.ending) return;
      if(qi>=qs.length){ clearInterval(timerv); endStage("knowledge",{}); return; }
      const q=qs[qi];
      root.innerHTML=`<div class="combo-pop" style="position:static;color:var(--gold);margin-bottom:4px">${sub.combo>=3?"🔥 "+sub.combo+" 连击":""}</div>
        <div class="quiz-q">${qi+1}/10 · ${q.cat||""}<br>${esc(q.q)}</div>
        <div class="quiz-opts">${q.o.map((op,i)=>`<div class="qopt" data-i="${i}"><span style="color:var(--dim)">${String.fromCharCode(65+i)}.</span> ${esc(op)}</div>`).join("")}</div>`;
      root.insertBefore(bar, root.firstChild);
      lock=false;
      root.querySelectorAll(".qopt").forEach(el=>{
        el.onclick=()=>{
          if(lock||sub.ending) return; lock=true;
          const i=Number(el.dataset.i);
          const correct=i===q.a;
          if(correct){
            el.classList.add("right"); sub.ok++; sub.combo++; if(sub.combo>sub.maxCombo)sub.maxCombo=sub.combo;
            const add=90+sub.combo*10;
            sub.score+=add; sfxPlay("ok");
          } else {
            el.classList.add("wrong"); sub.bad++; sub.combo=0; sub.score=Math.max(0,sub.score-30); sfxPlay("bad");
            root.querySelectorAll(".qopt")[q.a].classList.add("right");
          }
          updateHud(sub);
          setTimeout(()=>{ qi++; renderQ(); }, correct?520:850);
        };
      });
    };
    renderQ();
    setTimeout(()=>endStage("knowledge",{ok:sub.ok,bad:sub.bad}), endT*1000);
  }
};

function drawHistoryChart(data){
  const c=$("#hist-chart"); if(!c) return;
  const ctx=c.getContext("2d"), W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);
  if(data.length<2){
    ctx.fillStyle="rgba(138,160,200,.6)"; ctx.font="14px sans-serif"; ctx.textAlign="center";
    ctx.fillText("再玩几局就能看到成长曲线啦",W/2,H/2);
    return;
  }
  const totals=data.map(h=>h.total);
  const maxT=Math.max(...totals,1000);
  const minT=Math.min(...totals,0);
  const range=maxT-minT||1;
  const padL=30, padR=10, padT=15, padB=25;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const xStep=chartW/(data.length-1);
  // grid
  ctx.strokeStyle="rgba(0,240,255,.08)"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=padT+chartH*i/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); }
  // line
  ctx.beginPath(); ctx.strokeStyle="#00f0ff"; ctx.lineWidth=2;
  data.forEach((h,i)=>{
    const x=padL+i*xStep;
    const y=padT+chartH*(1-(h.total-minT)/range);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // fill
  ctx.beginPath(); ctx.moveTo(padL,padT+chartH);
  data.forEach((h,i)=>{ const x=padL+i*xStep; const y=padT+chartH*(1-(h.total-minT)/range); ctx.lineTo(x,y); });
  ctx.lineTo(padL+(data.length-1)*xStep,padT+chartH); ctx.closePath();
  ctx.fillStyle="rgba(0,240,255,.12)"; ctx.fill();
  // dots
  data.forEach((h,i)=>{
    const x=padL+i*xStep; const y=padT+chartH*(1-(h.total-minT)/range);
    ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fillStyle="#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.strokeStyle="rgba(0,240,255,.5)"; ctx.lineWidth=1; ctx.stroke();
  });
  // labels
  ctx.fillStyle="rgba(138,160,200,.8)"; ctx.font="10px sans-serif"; ctx.textAlign="center";
  data.forEach((h,i)=>{
    const x=padL+i*xStep;
    ctx.fillText(h.date.slice(5),x,H-6);
  });
}

function drawRadar(){
  const c=$("#radar"); if(!c) return;
  const ctx=c.getContext("2d"); const W=c.width,H=c.height;
  const cx=W/2, cy=H/2+8, R=105;
  const keys=["speed","memory","focus","knowledge","rhythm"];
  const labels=["算力","记忆","专注","知识","节奏"];
  const vals=keys.map(k=>Math.min(1, (S.dims[k].best||0)/1600));
  ctx.clearRect(0,0,W,H);
  const pt=(i,r)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/5), cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/5)];
  // rings
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<4;i++){ const [x,y]=pt(i,R*ring/4); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath(); ctx.strokeStyle="rgba(0,240,255,.14)"; ctx.lineWidth=1; ctx.stroke();
  }
  // axes
  for(let i=0;i<keys.length;i++){ const [x,y]=pt(i,R); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.strokeStyle="rgba(0,240,255,.12)"; ctx.stroke(); }
  ctx.beginPath();
  for(let i=0;i<keys.length;i++){ const [x,y]=pt(i,Math.max(.06,vals[i])*R); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"rgba(0,240,255,.45)"); g.addColorStop(1,"rgba(255,45,149,.45)");
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle="#00f0ff"; ctx.lineWidth=2.5; ctx.stroke();
  // dots
  for(let i=0;i<keys.length;i++){ const [x,y]=pt(i,Math.max(.06,vals[i])*R);
    ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle="#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.strokeStyle="rgba(0,240,255,.6)"; ctx.stroke();
  }
  // labels
  ctx.fillStyle="#8aa0c8"; ctx.font="bold 14px sans-serif"; ctx.textAlign="center";
  for(let i=0;i<4;i++){ const [x,y]=pt(i,R+24); ctx.fillText(labels[i],x,y+4); }
  // score text
  ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font="900 20px sans-serif"; ctx.fillText(Math.round(vals.reduce((a,b)=>a+b,0)/keys.length*1600), cx, cy+6);
  ctx.fillStyle="rgba(138,160,200,.7)"; ctx.font="11px sans-serif"; ctx.fillText("平均指数", cx, cy+24);
}

  $("#btn-reset").onclick=()=>{
    if(confirm("确认重置全部进度？此操作不可恢复！")){ localStorage.removeItem(SAVE_KEY); S=defaultSave(); save(); renderHome(); }
  };
}

function applyCyberLevel(){
  const lv=S.settings.cyberLevel||1;
  const grid=$("#cyber-grid"), scan=$("#scanline");
  if(grid) grid.style.opacity = lv>=1?"1":"0";
  if(scan) scan.classList.toggle("on", lv>=1);
  if(lv>=2 && grid){ grid.style.backgroundSize="20px 20px"; grid.querySelector&&(grid.style.filter="contrast(1.1)"); }
}
function exportSaveCode(){
  const raw=JSON.stringify(S);
  let code="";
  for(let i=0;i<raw.length;i+=2){
    const c=raw.charCodeAt(i);
    code+=String.fromCharCode((c%26)+65);
    if(i+1<raw.length){ const c2=raw.charCodeAt(i+1); code+=String.fromCharCode((c2%10)+48); }
  }
  return "BRAINLAB_"+btoa(raw).slice(0,80)+"_"+code.slice(0,40);
}
function importSaveCode(code){
  if(!code.startsWith("BRAINLAB_")) return false;
  const parts=code.split("_");
  if(parts.length<2) return false;
  try{
    const raw=atob(parts[1]);
    const o=JSON.parse(raw);
    if(!o.v) return false;
    S=Object.assign(defaultSave(),o);
    save();
    return true;
  }catch(e){ return false; }
}
function generateShareCard(r){
  const cvs=document.createElement("canvas"); cvs.width=560; cvs.height=700;
  const ctx=cvs.getContext("2d");
  // bg
  const g=ctx.createLinearGradient(0,0,0,700); g.addColorStop(0,"#070a12"); g.addColorStop(1,"#0c1220");
  ctx.fillStyle=g; ctx.fillRect(0,0,560,700);
  // grid
  ctx.strokeStyle="rgba(0,240,255,.06)"; ctx.lineWidth=1;
  for(let i=0;i<560;i+=40){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,700); ctx.stroke(); }
  for(let i=0;i<700;i+=40){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(560,i); ctx.stroke(); }
  // title
  ctx.fillStyle="#fff"; ctx.font="bold 36px sans-serif"; ctx.textAlign="center";
  ctx.fillText("🧠 三分钟高能",280,60);
  ctx.fillStyle="rgba(138,160,200,.8)"; ctx.font="16px sans-serif";
  ctx.fillText("HIGH ENERGY · 三分钟一局，爽到停不下来",280,85);
  // score
  ctx.fillStyle="#00f0ff"; ctx.font="900 72px sans-serif"; ctx.textAlign="center";
  ctx.fillText(r.total,280,180);
  ctx.fillStyle="rgba(138,160,200,.7)"; ctx.font="18px sans-serif";
  ctx.fillText("本次训练总分",280,210);
  // stars
  const stars=r.total>=3000?"⭐⭐⭐":r.total>=1600?"⭐⭐":"⭐";
  ctx.fillStyle="#ffd54a"; ctx.font="30px sans-serif"; ctx.fillText(stars,280,250);
  // details
  const dimsName={speed:"⚡ 算力",memory:"🧠 记忆",focus:"🎯 专注",knowledge:"📚 知识",rhythm:"🎵 节奏"};
  let y=300;
  r.modes.forEach(m=>{
    const sc=r.subAll[m].score;
    ctx.fillStyle="rgba(138,160,200,.8)"; ctx.font="18px sans-serif"; ctx.textAlign="left";
    ctx.fillText(dimsName[m],60,y);
    ctx.fillStyle="#00f0ff"; ctx.font="bold 22px sans-serif"; ctx.textAlign="right";
    ctx.fillText(sc+" 分",500,y);
    // bar
    ctx.fillStyle="rgba(0,240,255,.15)"; ctx.fillRect(60,y+8,440,6); ctx.fillStyle="rgba(0,240,255,.6)"; ctx.fillRect(60,y+8,Math.min(440,sc/5),6);
    y+=50;
  });
  // level
  const lv=level();
  ctx.fillStyle="rgba(138,160,200,.6)"; ctx.font="16px sans-serif"; ctx.textAlign="center";
  ctx.fillText(`Lv.${lv} · ${titleStr()} · 累计训练 ${S.totalSessions} 局`,280,580);
  // footer
  ctx.fillStyle="rgba(138,160,200,.4)"; ctx.font="13px sans-serif";
  ctx.fillText(new Date().toLocaleDateString("zh-CN")+"  ·  三分钟高能",280,650);
  return cvs.toDataURL("image/png");
}
function showTip(msg){
  const t=document.createElement("div"); t.className="float-tip"; t.innerHTML=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

/* ---------------- 知识模式引导 ---------------- */
function guideQuizChoice(){
  if(S.firstLaunch===false || S.settings.quizSet===true) return;
  const m=document.createElement("div"); m.className="guide"; m.id="quiz-guide";
  m.innerHTML=`<div class="guide-inner" style="max-width:360px">
    <div class="g-num">?</div><h2>知识冲刺模式</h2>
    <p>游戏包含「知识冲刺」玩法，覆盖通识、Python、HTML、英语四级等内容。<br><br>开启后，每次训练会随机抽到知识答题关。</p>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn" id="qg-on" style="flex:1">开启知识模式</button>
      <button class="btn ghost" id="qg-off" style="flex:1;border-color:rgba(255,45,149,.4);color:var(--pink)">暂不开启</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  $("#qg-on").onclick=()=>{ S.settings.quiz=true; S.settings.quizSet=true; S.firstLaunch=false; save(); m.remove(); showTip("知识冲刺已开启"); };
  $("#qg-off").onclick=()=>{ S.settings.quiz=false; S.settings.quizSet=true; S.firstLaunch=false; save(); m.remove(); showTip("知识冲刺已关闭，可在设置中重新开启"); };
}
/* ---------------- 新手引导 ---------------- */
function guide(){
  if(S.learned) return;
  S.learned=true; save();
  const g=document.createElement("div"); g.className="guide"; g.id="guide";
  const steps=[
    ["01","聚焦四维",'三分钟高能每天围绕「算力 · 记忆 · 专注 · 知识」四个维度训练，就像给大脑做力量训练。'],
    ["02","一套很快",'每次训练会自动抽 3 个小玩法连打，全程不超过 3 分钟——碎片时间就能练。'],
    ["03","自适应难度",'系统会根据你的表现自动调整难度：越强，关卡越有挑战，永远差一步又够得着。'],
    ["04","坚持有回报",'每日登录、任务、成就徽章、排行榜全都安排上了。现在，开始你的第一局吧！']
  ];
  let i=0;
  const draw=()=>{
    const s=steps[i];
    g.innerHTML=`<div class="g-num">${s[0]}</div><div class="step">新手引导 ${i+1}/${steps.length}</div>
      <h2>${s[1]}</h2><p>${s[2]}</p>
      <button class="btn" id="g-next">${i===steps.length-1?"开始挑战！":"下一步"}</button>`;
    $("#g-next").onclick=()=>{ sfxPlay("tap"); i++; if(i<steps.length) draw(); else { g.remove(); sfxPlay("start"); } };
  };
  document.body.appendChild(g); draw();
}

/* ---------------- 启动 ---------------- */
function init(){
  renderHome();
  applyCyberLevel();
  guide();
  guideQuizChoice();
  initBGM();
  // 首局欢迎
  if(S.totalSessions===0){
    setTimeout(()=>{
      const t=document.createElement("div"); t.className="float-tip";
      t.innerHTML="💡 点击「开始训练」即可开始第一局，试试吧！"; document.body.appendChild(t);
      setTimeout(()=>t.remove(),3000);
    },600);
  }
}
init();
</script>
